name: syncit

services:
  frontend:
    build:
      context: ./frontend
      target: ${BUILD_TARGET}
    volumes:
      - ./frontend:/project/frontend
      - /project/frontend/node_modules
      - frontend_dist:/project/frontend/dist
      - static_volume:/project/backend/django/static
    ports:
      - "80:80"
      - "3000:3000"
    depends_on:
      django:
        condition: service_healthy
    networks:
      - app-network

  django:
    build:
      context: ./backend/django
      target: ${BUILD_TARGET}
    volumes:
      - ./backend/django:/project/backend/django
      - static_volume:/project/backend/django/static/
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health-check/"]
      interval: 10s
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  go:
    build:
      context: ./backend/go
      target: ${BUILD_TARGET}
    volumes:
      - ./backend/go:/project/backend/go
    ports:
      - "9000:9000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health-check"]
      interval: 10s
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:16.6-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "${POSTGRES_HOST}", "-p", "${POSTGRES_PORT}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      start_period: 5s
    networks:
      - app-network

  redis:
    image: redis:7.4.2-alpine
    hostname: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      start_period: 5s
    networks:
      - app-network

  celery:
    restart: always
    build:
      context: ./backend/django
      target: ${BUILD_TARGET}
    volumes:
      - ./backend/django:/project/backend/django
    command: ["sh", "startup/celery.sh", "worker"]
    healthcheck:
      test: ["CMD", "celery", "-A", "core.celery.app", "inspect", "ping"]
      interval: 10s
      start_period: 20s
    depends_on:
      django:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - app-network

  celery-beat:
    build:
      context: ./backend/django
      target: ${BUILD_TARGET}
    volumes:
      - ./backend/django:/project/backend/django
    command: ["sh", "startup/celery.sh", "beat"]
    env_file:
      - .env
    depends_on:
      celery:
        condition: service_healthy
    networks:
      - app-network

  celery-flower:
    build:
      context: ./backend/django
      target: ${BUILD_TARGET}
    volumes:
      - ./backend/django:/project/backend/django
    command: ["sh", "startup/celery.sh", "flower"]
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      celery:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge


volumes:
  static_volume:
  frontend_dist:
  postgres_data:
